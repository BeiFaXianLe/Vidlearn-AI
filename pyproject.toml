[project]
name = "vidlearn-ai"
version = "0.1.0"
description = "VidLearn AI - local-first video learning workstation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "faster-whisper>=1.2.0,<1.3",
    "opencc-python-reimplemented>=0.1.7",
    "cryptography>=42",
    "pypinyin>=0.53",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["apps"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["apps", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
