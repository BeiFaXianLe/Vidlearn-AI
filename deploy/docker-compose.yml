# VidLearn AI — Docker Compose
# 用法（在 deploy/ 目录下）：
#   cp ../.env.example ../.env   # 填 LLM Key
#   docker compose up -d --build
services:
  vidlearn:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: vidlearn-ai:latest
    container_name: vidlearn
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"      # 只监听本机；需要外网访问时改成 8000:8000 并配 nginx/防火墙
    env_file:
      - ../.env
    environment:
      VIDLEARN_DATA_ROOT: /app/data
      VIDLEARN_ASR_MODEL_DIR: /app/models/faster-whisper-small
      PYTHONUTF8: "1"
    volumes:
      - ../data:/app/data
      - ../models:/app/models:ro
    # 长视频转码/ASR 需要较多内存，按需调整
    deploy:
      resources:
        limits:
          memory: 4g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
